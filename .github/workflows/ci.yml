name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Exercise CLI with real Git repositories
        run: python -m unittest discover -v
      - name: Build and install wheel in an isolated environment
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv "$RUNNER_TEMP/codegent-env"
          "$RUNNER_TEMP/codegent-env/bin/python" -m pip install --no-deps dist/*.whl
      - name: Exercise installed commands outside the source tree
        run: python scripts/smoke_installed.py "$RUNNER_TEMP/codegent-env/bin/codegent"
