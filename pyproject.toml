[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codegent"
dynamic = ["version"]
description = "Trace the evolutionary lineage of code across git history."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "codegent contributors" }]
license = { text = "MIT" }
dependencies = []

[project.scripts]
codegent = "codegent.cli:main"

[tool.setuptools.dynamic]
version = {attr = "codegent._version.__version__"}

[tool.setuptools.packages.find]
include = ["codegent*"]
